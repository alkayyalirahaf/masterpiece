<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Groups - Wanas</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main class="container page">
      <p class="eyebrow">Peer-led support</p>
      <h1>Find a group that gets it</h1>
      <p class="lede">Explore welcoming, moderated groups organized around shared experiences.</p>

      <!-- Search box -->
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search groups by name or keyword" />
      </div>

      <div class="catalog-layout">
        <!-- Filters -->
        <aside class="filters">
          <h3>Filters</h3>
          <label class="field">
            <span>Topic</span>
            <select id="topic-filter"><option value="">All topics</option></select>
          </label>
          <label class="field">
            <span>City</span>
            <select id="city-filter"><option value="">All cities</option></select>
          </label>
        </aside>

        <!-- Results -->
        <section>
          <p class="results-count" id="results-count"></p>
          <div class="card-grid card-grid--two" id="groups-list">
            <p>Loading groups...</p>
          </div>
        </section>
      </div>
    </main>

    <div id="site-footer"></div>

    <script type="module" src="../js/list-page.js"></script>
  </body>
</html>
